<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente para el núcleo galáctico -->
    <radialGradient id="galaxy-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#9900FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente para las nebulosas -->
    <radialGradient id="nebula-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#00FFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de brillo estelar -->
    <filter id="space-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo del espacio profundo -->
  <rect width="400" height="400" rx="15" fill="#020208" stroke="#9900FF" stroke-width="2"/>

  <!-- Estrellas de fondo titilantes -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="80" r="1" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="60" r="1.5" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="320" r="1" opacity="0.9"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="300" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="40" r="1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="200" r="1.5" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="180" r="1" opacity="0.8"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Núcleo de la Galaxia giratorio -->
  <g transform="translate(200, 200)">
    <circle r="150" fill="url(#galaxy-core)"/>
    <circle r="90" fill="url(#nebula-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Órbitas y líneas espirales de la galaxia -->
  <g stroke="#00FFFF" stroke-opacity="0.2" stroke-width="1" fill="none">
    <ellipse cx="200" cy="200" rx="170" ry="80" transform="rotate(30 200 200)" />
    <ellipse cx="200" cy="200" rx="170" ry="80" transform="rotate(-45 200 200)" />
    <circle cx="200" cy="200" r="130" stroke-dasharray="3 6" />
    <circle cx="200" cy="200" r="170" stroke="#9900FF" stroke-width="1.5" filter="url(#space-glow)"/>
  </g>

  <!-- Rayos láser de contraataque (IA cazando vulnerabilidades) -->
  <g stroke="#00FF66" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8">
    <line x1="200" y1="200" x2="80" y2="100"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="310" y2="85"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="120" y2="285"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="280" y2="290"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="65" y2="220"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="330" y2="200"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="190" y2="60"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="210" y2="335"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- Pulso de energía cósmica expansivo -->
  <circle cx="200" cy="200" r="20" fill="none" stroke="#00FF66" stroke-width="2" opacity="0">
    <animate attributeName="r" values="10;160" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- CENTRO DE CONTRATAQUE: NÚCLEO IA CAZADOR DE AMENAZAS -->
  <g transform="translate(200, 200)">
    <circle r="26" fill="#020208" stroke="#00FF66" stroke-width="2.5" filter="url(#space-glow)">
      <animate attributeName="stroke" values="#00FF66;#00FFFF;#FF0055;#00FF66" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="-10" y="7" font-size="16">🛡️</text>
    <text x="-38" y="42" fill="#00FFFF" font-family="monospace" font-size="8" font-weight="bold">HUNTER_AI_CORE</text>
  </g>

  <!-- ================= VULNERABILIDADES EN LA GALAXIA ================= -->

  <!-- 1. MALWARE -->
  <g transform="translate(80, 100)">
    <circle r="16" fill="#FF3300" opacity="0.3"><animate attributeName="r" values="10;20;10" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#0b0503" stroke="#FF3300" stroke-width="2"><animate attributeName="stroke" values="#FF3300;#FF0055;#FF3300" dur="0.8s" repeatCount="indefinite"/></circle>
    <text x="-6" y="4" font-size="12">☣️</text>
    <text x="-25" y="-14" fill="#FF3300" font-family="monospace" font-size="8" font-weight="bold">MALWARE</text>
  </g>

  <!-- 2. RANSOMWARE -->
  <g transform="translate(310, 85)">
    <circle r="16" fill="#FF0055" opacity="0.3"><animate attributeName="r" values="12;22;12" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#0b0305" stroke="#FF0055" stroke-width="2"><animate attributeName="stroke" values="#FF0055;#FFCC00;#FF0055" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="-6" y="4" font-size="12">🔒</text>
    <text x="-30" y="-14" fill="#FF0055" font-family="monospace" font-size="8" font-weight="bold">RANSOM</text>
  </g>

  <!-- 3. SQL INJECTION -->
  <g transform="translate(120, 285)">
    <circle r="16" fill="#FFCC00" opacity="0.3"><animate attributeName="r" values="9;19;9" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#0b0a03" stroke="#FFCC00" stroke-width="2"><animate attributeName="stroke" values="#FFCC00;#FF3300;#FFCC00" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="-6" y="4" font-size="12">💉</text>
    <text x="-22" y="24" fill="#FFCC00" font-family="monospace" font-size="8" font-weight="bold">SQL_INJECT</text>
  </g>

  <!-- 4. ZERO-DAY EXPLOIT -->
  <g transform="translate(280, 290)">
    <circle r="16" fill="#FF00FF" opacity="0.3"><animate attributeName="r" values="11;21;11" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle r="12" fill="#0b030b" stroke="#FF00FF" stroke-width="2"><animate attributeName="stroke" values="#FF00FF;#00FFFF;#FF00FF" dur="0.9s" repeatCount="indefinite"/></circle>
    <text x="-6" y="4" font-size="12">⚡</text>
    <text x="-22" y="24" fill="#FF00FF" font-family="monospace" font-size="8" font-weight="bold">ZERO_DAY</text>
  </g>

  <!-- 5. XSS -->
  <g transform="translate(65, 220)">
    <circle r="15" fill="#FF6600" opacity="0.3"><animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#0b0503" stroke="#FF6600" stroke-width="2"><animate attributeName="stroke" values="#FF6600;#FFCC00;#FF6600" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="-5" y="4" font-size="11">🌐</text>
    <text x="-18" y="22" fill="#FF6600" font-family="monospace" font-size="8" font-weight="bold">XSS</text>
  </g>

  <!-- 6. PHISHING -->
  <g transform="translate(330, 200)">
    <circle r="15" fill="#00FFFF" opacity="0.3"><animate attributeName="r" values="10;20;10" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#03090b" stroke="#00FFFF" stroke-width="2"><animate attributeName="stroke" values="#00FFFF;#00FF66;#00FFFF" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="-5" y="4" font-size="11">🎣</text>
    <text x="-22" y="22" fill="#00FFFF" font-family="monospace" font-size="8" font-weight="bold">PHISHING</text>
  </g>

  <!-- 7. BUFFER OVERFLOW -->
  <g transform="translate(190, 60)">
    <circle r="15" fill="#FF0055" opacity="0.3"><animate attributeName="r" values="9;19;9" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#0b0305" stroke="#FF0055" stroke-width="2"><animate attributeName="stroke" values="#FF0055;#FF3300;#FF0055" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="-5" y="4" font-size="11">💥</text>
    <text x="-28" y="-14" fill="#FF0055" font-family="monospace" font-size="8" font-weight="bold">OVERFLOW</text>
  </g>

  <!-- 8. DDoS -->
  <g transform="translate(210, 335)">
    <circle r="15" fill="#FFCC00" opacity="0.3"><animate attributeName="r" values="12;22;12" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle r="11" fill="#0b0a03" stroke="#FFCC00" stroke-width="2"><animate attributeName="stroke" values="#FFCC00;#FF0055;#FFCC00" dur="1s" repeatCount="indefinite"/></circle>
    <text x="-5" y="4" font-size="11">🚨</text>
    <text x="-18" y="24" fill="#FFCC00" font-family="monospace" font-size="8" font-weight="bold">DDoS_FLOOD</text>
  </g>

  <!-- Interfaz HUD Galáctico -->
  <text x="20" y="35" fill="#00FFFF" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">GALAXY_SECTOR // HUNTER_ACTIVE</text>
  <text x="20" y="378" fill="#00FF66" font-family="monospace" font-size="10" font-weight="bold">STATUS: TARGETING_AND_NEUTRALIZING_VULNS</text>
  <text x="335" y="378" fill="#00FFFF" font-family="monospace" font-size="10">LIVE</text>
</svg>
