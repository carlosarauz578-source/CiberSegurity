<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fondo partido Red vs Blue -->
    <linearGradient id="bg-split" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120204"/>
      <stop offset="50%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#020912"/>
    </linearGradient>

    <!-- Gradiente Red Team -->
    <radialGradient id="red-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente Blue Team -->
    <radialGradient id="blue-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro de brillo -->
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo base del campo de batalla cibernético -->
  <rect width="400" height="400" rx="15" fill="url(#bg-split)" stroke="#444466" stroke-width="2"/>

  <!-- Línea divisoria central de enfrentamiento -->
  <line x1="200" y1="50" x2="200" y2="350" stroke="#444466" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Zonas de influencia (Glows) -->
  <circle cx="100" cy="200" r="110" fill="url(#red-glow)"/>
  <circle cx="300" cy="200" r="110" fill="url(#blue-glow)"/>

  <!-- Rayos de colisión en el centro (Choque ofensiva vs defensiva) -->
  <g stroke-width="1.5" filter="url(#cyber-glow)">
    <line x1="120" y1="150" x2="280" y2="250" stroke="#FF0033" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="250" x2="280" y2="150" stroke="#00CCFF" opacity="0.7">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="200" x2="250" y2="200" stroke="#FFFF00" stroke-width="2" stroke-dasharray="2 4">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= LADO IZQUIERDO: RED TEAM (OFENSIVA) ================= -->
  
  <text x="35" y="45" fill="#FF0033" font-family="monospace" font-size="12" font-weight="bold">🔴 RED_TEAM (ATTACK)</text>

  <!-- Nodo Malware -->
  <g transform="translate(75, 120)">
    <circle r="16" fill="#1a0005" stroke="#FF0033" stroke-width="2">
      <animate attributeName="r" values="14;18;14" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">☣️</text>
    <text x="-25" y="-20" fill="#FF0033" font-family="monospace" font-size="8" font-weight="bold">EXPLOIT</text>
  </g>

  <!-- Nodo Ransomware -->
  <g transform="translate(130, 200)">
    <circle r="16" fill="#1a0005" stroke="#FF3366" stroke-width="2">
      <animate attributeName="r" values="15;19;15" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">🏴‍☠️</text>
    <text x="-22" y="-20" fill="#FF3366" font-family="monospace" font-size="8" font-weight="bold">PAYLOAD</text>
  </g>

  <!-- Nodo Zero-Day -->
  <g transform="translate(75, 280)">
    <circle r="16" fill="#1a0005" stroke="#FF0033" stroke-width="2">
      <animate attributeName="r" values="13;17;13" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">⚡</text>
    <text x="-25" y="26" fill="#FF0033" font-family="monospace" font-size="8" font-weight="bold">BREACH</text>
  </g>


  <!-- ================= LADO DERECHO: BLUE TEAM (DEFENSA) ================= -->

  <text x="235" y="45" fill="#00CCFF" font-family="monospace" font-size="12" font-weight="bold">🔵 BLUE_TEAM (DEFENSE)</text>

  <!-- Nodo SOC / Firewall -->
  <g transform="translate(325, 120)">
    <circle r="16" fill="#001122" stroke="#00CCFF" stroke-width="2">
      <animate attributeName="r" values="14;18;14" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">🛡️</text>
    <text x="-20" y="-20" fill="#00CCFF" font-family="monospace" font-size="8" font-weight="bold">FIREWALL</text>
  </g>

  <!-- Nodo SIEM / Monitor -->
  <g transform="translate(270, 200)">
    <circle r="16" fill="#001122" stroke="#0099FF" stroke-width="2">
      <animate attributeName="r" values="15;19;15" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">👁️</text>
    <text x="-16" y="-20" fill="#0099FF" font-family="monospace" font-size="8" font-weight="bold">SIEM</text>
  </g>

  <!-- Nodo Patch / Mitigación -->
  <g transform="translate(325, 280)">
    <circle r="16" fill="#001122" stroke="#00CCFF" stroke-width="2">
      <animate attributeName="r" values="13;17;13" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="-6" y="5" font-size="12">🩹</text>
    <text x="-22" y="26" fill="#00CCFF" font-family="monospace" font-size="8" font-weight="bold">PATCH_FIX</text>
  </g>


  <!-- ================= HUD INFERIOR Y ESTADO ================= -->
  <rect x="20" y="340" width="360" height="40" rx="6" fill="#080810" stroke="#333355" stroke-width="1"/>
  <text x="35" y="365" fill="#00FF66" font-family="monospace" font-size="10" font-weight="bold">STATUS: LIVE_SIMULATION // CONFLICT_ACTIVE</text>
  <circle cx="355" cy="360" r="4" fill="#00FF66">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
